<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>月影车姬</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="./styles.css?v=20260910c" />
</head>
<body>
  <div id="toast" class="toast hidden"></div>

  <section id="boot" class="boot">
    <div class="boot-card">
      <h1>月影车姬</h1>
      <p id="bootMsg" class="muted">正在连接…</p>
      <button id="bootRetry" class="btn primary block hidden" type="button">重试</button>
    </div>
  </section>

  <!-- 身份门默认隐藏：首次自动设为客人 -->
  <section id="gate" class="gate hidden" aria-hidden="true"></section>

  <div id="app" class="hidden">
    <header class="topbar">
      <div>
        <h1>月影车姬</h1>
        <div id="topMeta" class="muted"></div>
      </div>
      <button id="btnCity" class="chip" type="button">城市 ▾</button>
    </header>

    <main id="main">
      <section id="view-home" class="view">
        <div id="announce" class="announce hidden"></div>
        <div id="pins" class="pins"></div>
        <div id="feed" class="feed feed-one-col"></div>
        <button id="btnLoadMore" class="btn block hidden" type="button">加载更多</button>
      </section>

      <section id="view-msg" class="view hidden">
        <div class="empty card">
          <h3>消息</h3>
          <p class="muted">会话在 Bot 里进行。点「想聊聊」后回到 Telegram 对话即可。</p>
        </div>
      </section>

      <section id="view-publish" class="view hidden">
        <form id="publishForm" class="card form">
          <h3 id="publishTitle">发布</h3>
          <label>相册（图/视频，最多 9）</label>
          <input id="pubFiles" type="file" accept="image/*,video/*" multiple />
          <div id="pubPreview" class="media-preview"></div>
          <label>称呼</label>
          <input id="pubTitle" required maxlength="64" placeholder="怎么称呼你" />
          <label>城市</label>
          <select id="pubCity" required></select>
          <label>简介</label>
          <textarea id="pubDesc" rows="3" maxlength="2000" placeholder="简单介绍一下"></textarea>
          <details class="advanced">
            <summary>更多选填</summary>
            <label>价位</label>
            <input id="pubPrice" placeholder="面议 / 6000+" />
            <label>区</label>
            <input id="pubDistrict" maxlength="64" placeholder="例如：南山区" />
            <label>大致位置</label>
            <input id="pubApprox" maxlength="128" placeholder="例如：科技园附近" />
            <label>标签（空格分隔，最多 5）</label>
            <input id="pubTags" placeholder="清新 健谈" />
            <textarea id="pubMedia" class="hidden" rows="1" aria-hidden="true"></textarea>
          </details>
          <button class="btn primary block big" type="submit">提交审核</button>
        </form>
      </section>

      <section id="view-me" class="view hidden">
        <div id="meCard" class="card"></div>
        <div class="card">
          <h3>我的身份</h3>
          <p class="muted hint">浏览默认是客人；发布时再选老师/商家。</p>
          <label>聊天代称（仅会话显示，不公开账号）</label>
          <div class="row">
            <input id="guestNick" maxlength="16" placeholder="例如：小明" style="flex:1;margin:0" />
            <button class="btn" id="btnSaveNick" type="button">保存</button>
          </div>
          <div class="row" style="margin-top:8px">
            <button class="btn" data-switch="guest" type="button">客人</button>
            <button class="btn" data-switch="teacher" type="button">老师</button>
            <button class="btn" data-switch="merchant" type="button">商家</button>
          </div>
        </div>
        <div class="card">
          <h3>我的评价</h3>
          <div id="myReviews"></div>
        </div>
        <div class="card hints">
          <div id="adminEntry" class="hidden">
            <a class="btn primary" href="./admin.html?v=20260910c">管理后台</a>
          </div>
        </div>
      </section>

      <section id="view-detail" class="view hidden">
        <button class="btn ghost" id="btnBackHome" type="button">← 返回</button>
        <div id="detail"></div>
      </section>

      <section id="view-review" class="view hidden">
        <form id="reviewForm" class="card form">
          <h3>提交评价</h3>
          <input type="hidden" id="revLampId" />
          <label>星级 1-5</label>
          <input id="revStars" type="number" min="1" max="5" value="5" required />
          <label>文字</label>
          <textarea id="revText" rows="3" maxlength="2000"></textarea>
          <label>图片链接（可选，空格分隔）</label>
          <input id="revPhotos" />
          <button class="btn primary block" type="submit">提交评价</button>
        </form>
      </section>
    </main>

    <nav class="bottom-nav">
      <button data-nav="home" class="nav-item active" type="button"><span>首页</span></button>
      <button data-nav="msg" class="nav-item" type="button"><span>消息</span></button>
      <button data-nav="publish" class="nav-item" type="button"><span>发布</span></button>
      <button data-nav="me" class="nav-item" type="button"><span>我的</span></button>
    </nav>
  </div>

  <div id="citySheet" class="sheet hidden">
    <div class="sheet-panel">
      <h3>选择城市</h3>
      <div id="cityList"></div>
      <button class="btn block" id="cityClose" type="button">关闭</button>
    </div>
  </div>

  <div id="rulesSheet" class="sheet hidden">
    <div class="sheet-panel">
      <h3 id="rulesTitle">口碑分说明</h3>
      <ul id="rulesList"></ul>
      <button class="btn block" id="rulesClose" type="button">知道了</button>
    </div>
  </div>

  <script src="./boot-inline.js?v=20260910c"></script>
  <script src="./app.js?v=20260910c"></script>
</body>
</html>
