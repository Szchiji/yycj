<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>月影车姬</title>
  <script src="./telegram-web-app.js"></script>
  <!-- CDN fallback if local SDK missing -->
  <script>
  if (!(window.Telegram && window.Telegram.WebApp)) {
    document.write('<script src="https://telegram.org/js/telegram-web-app.js"><\/script>');
  }
  </script>
  <link rel="stylesheet" href="./styles.css?v=20260910" />
</head>
<body>
  <div id="toast" class="toast hidden"></div>

  <section id="boot" class="boot">
    <div class="boot-card">
      <h1>🌕 月影车姬</h1>
      <p id="bootMsg" class="muted">正在连接…</p>
      <button id="bootRetry" class="btn primary block hidden" type="button">重试</button>
    </div>
  </section>

  <section id="gate" class="gate hidden">
    <div class="gate-card">
      <h1>🌕 月影车姬</h1>
      <p class="muted">请选择你的身份（之后可在「我的」切换）</p>
      <button class="role-btn" data-role="guest" type="button">客人</button>
      <button class="role-btn" data-role="teacher" type="button">老师</button>
      <button class="role-btn" data-role="merchant" type="button">商家</button>
    </div>
  </section>

  <div id="app" class="hidden">
    <header class="topbar">
      <div>
        <h1>月影车姬</h1>
        <div id="topMeta" class="muted"></div>
      </div>
      <button id="btnCity" class="chip" type="button">城市 ▾</button>
    </header>

    <main id="main">
      <section id="view-home" class="view">
        <div id="announce" class="announce hidden"></div>
        <div id="pins" class="pins"></div>
        <div id="feed" class="feed"></div>
      </section>

      <section id="view-msg" class="view hidden">
        <div class="empty card">
          <h3>消息</h3>
          <p class="muted">会话在 Bot 中进行。发起「想聊聊」后，请回到 Telegram 对话接受/回复。</p>
        </div>
      </section>

      <section id="view-publish" class="view hidden">
        <form id="publishForm" class="card form">
          <h3 id="publishTitle">发布资料</h3>
          <label>城市</label>
          <select id="pubCity" required></select>
          <label>称呼</label>
          <input id="pubTitle" required maxlength="64" placeholder="对外称呼" />
          <label>价位</label>
          <input id="pubPrice" placeholder="面议 / 6000+" />
          <label>区</label>
          <input id="pubDistrict" maxlength="64" placeholder="例如：南山区" />
          <label>大致位置（模糊文案）</label>
          <input id="pubApprox" maxlength="128" placeholder="例如：科技园附近" />
          <label>自定义标签（空格分隔，最多 5）</label>
          <input id="pubTags" placeholder="清新 健谈" />
          <label>简介</label>
          <textarea id="pubDesc" rows="4" maxlength="2000"></textarea>
          <label>媒体 URL（图/视频，合计≤9，一行一个；视频写 video|URL）</label>
          <textarea id="pubMedia" rows="4" placeholder="https://…&#10;video|https://…/clip.mp4"></textarea>
          <p class="hint">TODO：二进制相册上传；当前请用公网 URL 或 file_id。</p>
          <button class="btn primary block" type="submit">提交审核</button>
        </form>
      </section>

      <section id="view-me" class="view hidden">
        <div id="meCard" class="card"></div>
        <div class="card">
          <h3>切换身份</h3>
          <div class="row">
            <button class="btn" data-switch="guest" type="button">客人</button>
            <button class="btn" data-switch="teacher" type="button">老师</button>
            <button class="btn" data-switch="merchant" type="button">商家</button>
          </div>
        </div>
        <div class="card">
          <h3>我的评价</h3>
          <div id="myReviews"></div>
        </div>
        <div class="card hints">
          <p>· 媒体图+视频合计最多 9 个</p>
          <p>· 举报结果以 Bot 通知为准</p>
          <div id="adminEntry" class="hidden" style="margin-top:10px">
            <a class="btn primary" href="./admin.html">打开管理控制台</a>
          </div>
        </div>
      </section>

      <section id="view-detail" class="view hidden">
        <button class="btn ghost" id="btnBackHome" type="button">← 返回</button>
        <div id="detail"></div>
      </section>

      <section id="view-review" class="view hidden">
        <form id="reviewForm" class="card form">
          <h3>提交评价</h3>
          <input type="hidden" id="revLampId" />
          <label>星级 1-5</label>
          <input id="revStars" type="number" min="1" max="5" value="5" required />
          <label>文字</label>
          <textarea id="revText" rows="3" maxlength="2000"></textarea>
          <label>可选图片 URL（空格分隔）</label>
          <input id="revPhotos" />
          <button class="btn primary block" type="submit">提交（待管理员审核）</button>
        </form>
      </section>
    </main>

    <nav class="bottom-nav">
      <button data-nav="home" class="nav-item active" type="button"><span>首页</span></button>
      <button data-nav="msg" class="nav-item" type="button"><span>消息</span></button>
      <button data-nav="publish" class="nav-item" type="button"><span>发布</span></button>
      <button data-nav="me" class="nav-item" type="button"><span>我的</span></button>
    </nav>
  </div>

  <div id="citySheet" class="sheet hidden">
    <div class="sheet-panel">
      <h3>选择城市</h3>
      <div id="cityList"></div>
      <button class="btn block" id="cityClose" type="button">关闭</button>
    </div>
  </div>

  <div id="rulesSheet" class="sheet hidden">
    <div class="sheet-panel">
      <h3 id="rulesTitle">口碑分说明</h3>
      <ul id="rulesList"></ul>
      <button class="btn block" id="rulesClose" type="button">知道了</button>
    </div>
  </div>

  <script src="./app.js?v=20260910"></script>
</body>
</html>
